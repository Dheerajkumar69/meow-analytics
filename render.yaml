# Render Blueprint Specification for Meow Analytics
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. API Web Service (Render Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: meow-analytics-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:api
    startCommand: npm run start -w @meow-analytics/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false # External persistent PostgreSQL (Neon, Supabase, Render Postgres, etc.)
      - key: DATABASE_SSL
        value: "true"
      - key: MEOW_SECRET
        generateValue: true # Secure 32-character random secret generated by Render
      - key: ADMIN_SECRET
        generateValue: true # Secure admin authentication token generated by Render
      - key: CORS_ORIGINS
        value: "*" # Set to specific dashboard/tracking domains in production
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: GEOIP_DATABASE
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Dashboard Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: meow-analytics-dashboard
    runtime: static
    buildCommand: npm install && npm run build:dashboard
    staticPublishPath: ./apps/dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://meow-analytics-api.onrender.com
