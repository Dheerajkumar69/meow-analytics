# Meow Analytics — Nginx Host Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/meow-analytics and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name analytics.yourdomain.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.yourdomain.com;

    # SSL Certificate files (uncomment once obtained via certbot)
    # ssl_certificate /etc/letsencrypt/live/analytics.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/analytics.yourdomain.com/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum upload size for event batches
    client_max_body_size 10M;

    # Dashboard & Reverse Proxy to Meow Analytics
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
