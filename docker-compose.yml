version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: meow_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meow_secret
      POSTGRES_DB: meow_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meow -d meow_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
