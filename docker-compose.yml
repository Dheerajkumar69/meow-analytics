version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: meow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meow_secret
      POSTGRES_DB: meow_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meow -d meow_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: meow_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://meow:meow_secret@postgres:5432/meow_analytics
      MEOW_SECRET: meow_production_secret_32_characters_minimum_12345
      ADMIN_SECRET: meow_admin_super_secret_key_12345
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
      ASYNC_INGESTION: "true"
      DATABASE_POOL_MAX: 25
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: meow_dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
