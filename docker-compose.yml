services:
  postgres:
    image: postgres:16-alpine
    container_name: meow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-meow_analytics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-meow} -d $${POSTGRES_DB:-meow_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not bind to host port 5432 to avoid conflicts with any host PostgreSQL service

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: meow_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-meow}:${POSTGRES_PASSWORD:-meow_secret}@postgres:5432/${POSTGRES_DB:-meow_analytics}}
      MEOW_SECRET: ${MEOW_SECRET:-meow_production_secret_32_characters_minimum_12345}
      ADMIN_SECRET: ${ADMIN_SECRET:-meow_admin_super_secret_key_12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ASYNC_INGESTION: ${ASYNC_INGESTION:-true}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-25}
    ports:
      - "127.0.0.1:3001:3001"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: meow_dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PORT_HTTP:-8080}:80"

volumes:
  postgres_data:
    driver: local
