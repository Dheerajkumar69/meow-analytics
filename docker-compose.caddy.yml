version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: meow_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    depends_on:
      - dashboard
      - api

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
